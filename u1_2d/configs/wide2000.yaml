# Widened-coverage retrain, the u1 twin of u2_2d/configs/wide.yaml (built the
# same day, same reasoning): identical to wide250.yaml in EVERY respect
# except the 7 new fixed rungs appended below (beta 300-2000, generated
# 2026-09-03 via configs/widening_test.yaml) and the checkpoint path, so any
# quality change is attributable to coverage alone -- same isolation
# discipline wide250.yaml itself used against v2.yaml, and wide.yaml used
# against default.yaml.
#
# The new rungs' ensembles already exist under out/u1_2d/data_wide/ (copied
# from out/u1_2d/data_widening_test/) and are validated against the closed
# form by u1_2d/scripts/69_widening_test_data_check.py: 6 of 7 rungs clean
# (|z| <= 2.01 on plaquette and <Q^2>), beta=2000 flagged at z=5.48 on
# plaquette -- plausible under-thermalization at the stiffest coupling,
# since burn_in was held flat at 2000 sweeps across all seven rungs rather
# than tapered up for the highest beta. Worth a longer burn-in rerun at
# beta=2000 specifically before trusting that one rung; the other six are
# fine to train on as-is.
#
# random_rungs is UNCHANGED from wide250.yaml (still beta_max=250) --
# extending it too would need ~100 new ensembles this session has not
# generated, mirroring exactly the same choice made for u2_2d/configs/
# wide.yaml (dropped random_rungs there for the same reason). The new fixed
# rungs alone extend model_beta coverage from 250 to 2000, an 8x extension.
#
# NOT YET LAUNCHED: prepared so it is ready to fire the moment GPU capacity
# frees (currently at 4 concurrent contexts between u2's retrain and its
# relaxation matrix).

seed: 0
device: auto
action_type: wilson

data:
  out_dir: out/u1_2d/data_wide
  rungs:
    - {beta: 14.1464, lattice_size: 16, hot_start: false, burn_in: 600, sector_augment: 0.5}
    - {beta: 25.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 40.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 55.0237, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    # NEW: widening-coverage rungs, L=16, sector-augmented (see header).
    - {beta: 300.0,  lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 400.0,  lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 550.0,  lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 750.0,  lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 1000.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 1500.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 2000.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
  random_rungs:
    - {n: 60, beta_min: 1.0, beta_max: 250.0, lattice_size: 16, n_configs: 128}
    - {n: 12, beta_min: 2.0, beta_max: 250.0, lattice_size: 32, n_configs: 128}
    - {n: 6, beta_min: 1.0, beta_max: 35.0, lattice_size: 8, n_configs: 128}
  heldout:
    - {beta: 20.0, lattice_size: 16, hot_start: false, burn_in: 2000, n_configs: 128}
  n_configs: 448
  n_chains: 16
  burn_in: 200
  thin: 5
  hmc_steps: 5
  hmc_step_size: 0.2
  topological_updates: true
  hot_start: true

train:
  epochs: 100
  batch_size: 16
  learning_rate: 3.0e-4
  sigma_min: 0.03
  sigma_max: 6.0
  sigma_min_beta_coef: 0.3
  high_beta_sigma_bias: 0.3
  sym_augment: 0.5
  norm_type: channel
  cond_film: true
  hidden: 56
  depth: 4
  kernel_size: 3
  cond_channels: 5
  val_fraction: 0.1
  topo_weight: 0.1
  early_stop_patience: 0
  ema_decay: 0.999
  grad_clip_norm: 1.0
  snapshot_every: 5
  checkpoint: out/u1_2d/checkpoints/score_net_wide2000.pt
  history: out/u1_2d/checkpoints/score_net_wide2000.history.json

ladder:
  base: {beta: 1.3472, lattice_size: 8}
  n_base_configs: 192
  beta_schedule: [4.0, 14.1464, 55.0237]
  n_retherm_sweeps: 16
  n_sampler_steps: 200
  n_corrector_steps: 1
  corrector_snr: 0.16
  consistency_weight: 1.0
  enforce_coarse_charge: true
  charge_projection_sigma: 0.5
  charge_projection_interval: 10
  retherm_topological_updates: false
  sample_batch_size: 32
  out_dir: out/u1_2d/generated_wide2000
  physics_blend_coef: 1.0
  physics_blend_beta_min: 5.0
  sigma_min_beta_coef: 0.1

validate:
  out_dir: out/u1_2d/validation_wide2000
  n_reference_configs: 384
  freezing_rung: {beta: 55.0237, lattice_size: 64}
  freezing_hmc_length: 300
