# NOT DEPLOYED. This config is the RECORD OF A NEGATIVE RESULT, kept because the
# result is worth keeping: it is `v3_scale.yaml` with the reverse-diffusion
# sampler at 18 steps instead of 200, and running it end to end is what showed
# that 200 is justified.
#
# WHAT HAPPENED. `63_sampler_steps.py` originally recommended 18 steps as a
# 10-14x saving at no cost. It was measuring the wrong sampler: it called
# `generate_fine_from_coarse` with the bare function defaults, which have
# `physics_blend_coef = 0.0`, while the deployed ladder runs
# `physics_blend_coef: 1.0`, `physics_blend_beta_min: 5.0` and rebuilds the noise
# schedule with `sigma_min_beta_coef: 0.1` before sampling. The blend and the
# step count interact, so an unblended scan cannot see the cost.
#
# WHAT THIS CONFIG MEASURED, `out/u1_2d/validation_s18/` against
# `out/u1_2d/validation/`. The DELIVERED ensemble is fine -- max |z| vs the
# closed form goes 2.07 -> 1.42, 1.74 -> 2.18 and 1.28 -> 1.64 across the three
# rungs, all still at or below 2. The RAW lift is 3-4x worse at every rung:
# max |z| 6.7 -> 18.2, 5.4 -> 28.5 and 12.3 -> 53.1. Sixteen rethermalization
# sweeps repair the difference, so the ensemble hides what the seed pays.
#
# WHY THAT SETTLES IT. The paper sells BOTH products, and they want different
# step counts. Re-run with the deployed knobs
# (`out/u1_2d/sampler_steps_deployed/`), worst-loop |z| at beta_f = 55.02 /
# 218.58:
#
#   steps    raw            post           cost
#       12   32.9 / 36.9    0.50 / 0.58    17x cheaper
#       18   16.0 / 19.7    0.44 / 0.52    11x cheaper
#      100    3.4 / 17.4    0.44 / 0.50     3x cheaper
#      200    1.0 /  4.3    0.43 / 0.50     --
#
# The post column is flat from 12 steps up; the raw column is still falling at
# 100. So the knee for the DELIVERED ensemble is 18 steps and the knee for the
# SEED is 200, and every seed-quality claim in the paper -- t_therm, N*, the
# prolongator ablation -- is measured on the raw lift. **`v3_scale.yaml` stays at
# 200.** The earlier "u1 is leaving a factor of 10-20 on the table" is withdrawn.
#
# The one place a cheap sampler is defensible is a run that only ever consumes
# the rethermalized output. Say so explicitly if one is ever set up.
seed: 0
device: auto
action_type: wilson

data:
  out_dir: out/u1_2d/data
  rungs:
    - {beta: 14.1464, lattice_size: 16, hot_start: false, burn_in: 600, sector_augment: 0.5}
    - {beta: 25.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 40.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 55.0237, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
  random_rungs:
    - {n: 60, beta_min: 1.0, beta_max: 60.0, lattice_size: 16, n_configs: 128}
    - {n: 12, beta_min: 2.0, beta_max: 60.0, lattice_size: 32, n_configs: 128}
    - {n: 6, beta_min: 1.0, beta_max: 8.0, lattice_size: 8, n_configs: 128}
    - {n: 24, beta_min: 2.0, beta_max: 60.0, lattice_size: 32, n_configs: 128}
  heldout:
    - {beta: 20.0, lattice_size: 16, hot_start: false, burn_in: 2000, n_configs: 128}
  n_configs: 448
  n_chains: 16
  burn_in: 200
  thin: 5
  hmc_steps: 5
  hmc_step_size: 0.2
  topological_updates: true
  hot_start: true

train:
  epochs: 80
  batch_size: 16
  learning_rate: 3.0e-4
  sigma_min: 0.03
  sigma_max: 6.0
  sigma_min_beta_coef: 0.3
  high_beta_sigma_bias: 0.3
  sym_augment: 0.5
  norm_type: channel
  cond_film: true
  hidden: 80
  depth: 5
  kernel_size: 3
  cond_channels: 5
  val_fraction: 0.1
  topo_weight: 0.1
  early_stop_patience: 12
  ema_decay: 0.999
  grad_clip_norm: 1.0
  snapshot_every: 5
  checkpoint: out/u1_2d/checkpoints/score_net_big.pt
  history: out/u1_2d/checkpoints/history_big.json

ladder:
  base: {beta: 1.3472, lattice_size: 8}
  n_base_configs: 192
  beta_schedule: [4.0, 14.1464, 55.0237]
  n_retherm_sweeps: 16
  n_sampler_steps: 18
  n_corrector_steps: 1
  corrector_snr: 0.16
  consistency_weight: 1.0
  enforce_coarse_charge: true
  charge_projection_sigma: 0.5
  charge_projection_interval: 10
  retherm_topological_updates: false
  sample_batch_size: 32
  out_dir: out/u1_2d/generated_s18
  physics_blend_coef: 1.0
  physics_blend_beta_min: 5.0
  sigma_min_beta_coef: 0.1

validate:
  out_dir: out/u1_2d/validation_s18
  n_reference_configs: 384
  freezing_rung: {beta: 55.0237, lattice_size: 64}
  freezing_hmc_length: 300
