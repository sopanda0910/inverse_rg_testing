# Extends u1's random-beta coverage past wide250.yaml's random_rungs
# ceiling (beta_max=250) up to 2000, matching wide2000.yaml's new fixed-rung
# range. Originally queued for the Snapdragon X Elite machine
# (docs/SNAPDRAGON_TASKS.md); moved to run locally on Windows CPU 2026-09-04
# after that machine's run kept failing.
#
# REWRITTEN 2026-09-04 as explicit fixed rungs, not a random_rungs block.
# The first version used random_rungs with expand_rungs()'s auto-tapered
# burn_in (2000 sweeps flat for any cold-start rung beta >= 20), which
# 69_widening_test_data_check.py found insufficient at these couplings: a
# sign test on the 30 rungs found 23/30 positive z (p=0.005) -- a genuine
# systematic, not noise, and every cold-start rung's plaquette started at
# exactly 1.0 and relaxed toward the true value, so a coherent POSITIVE bias
# is exactly the signature of under-relaxation. Confirmed causally by
# regenerating the worst offender (L32, beta=381.875) at burn_in=8000:
# z went from +4.88 to -0.55. Worse for L32 (3/6 rungs flagged) than L16
# (4/24), consistent with a larger lattice needing more sweeps to mix.
# random_rungs' burn_in policy is NOT overridable per-spec (hardcoded inside
# utils.expand_rungs), so the same 30 (beta, lattice_size) draws are
# reproduced here as explicit rungs with burn_in: 8000 throughout -- the one
# verified-sufficient value, not a tapered guess. Cross-checked against the
# EXISTING wide250/wide2000 random_rungs data (beta capped at 250): those
# show no such systematic (7/12 L32 rungs positive, statistically
# unremarkable), so this issue is specific to this beta>250 extension and
# does NOT implicate the already-trained score_net_wide250.pt or the
# in-progress score_net_wide2000.pt.
seed: 1
device: cpu
action_type: wilson

data:
  out_dir: out/u1_2d/data_random_2000
  n_chains: 16
  thin: 5
  burn_in: 200
  n_configs: 128
  hmc_steps: 5
  hmc_step_size: 0.2
  hot_start: true
  topological_updates: true
  rungs:
    - {beta: 1227.28, lattice_size: 16, hot_start: false, burn_in: 8000}
    - {beta: 1276.08, lattice_size: 16, hot_start: false, burn_in: 8000}
