# SECTOR-COVERAGE FIX, 2026-09-07. Twin of this file with `sector_augment`
# added to every rung, plus an isolated out_dir so the original data is kept
# for the controlled comparison.
#
# THE DEFECT, MEASURED not inferred. Every one of the 30 rungs here was
# generated by honest HMC with `topological_updates: true` and NO
# `sector_augment`, and at these couplings that produces ensembles occupying
# exactly ONE topological sector: 33 of the 41 u1 training rungs above
# beta=200 have all 128 configurations at Q=0, against 5 sectors each for the
# 8 rungs that do carry `sector_augment: 0.5`.
#
# NOTE WHAT IS AND IS NOT WRONG WITH THEM. At these couplings the exact
# distribution really is almost all Q=0 (P(Q!=0) = 4.7e-09 at beta=258,
# 1.6e-05 at beta=1935), so these ensembles are not measurably wrong in their
# sector FREQUENCIES -- they are correct. What they lack is COVERAGE: zero
# examples of Q != 0 local structure at that coupling. That matters because at
# deployment Q is IMPOSED by transport from a coarse ensemble that may well
# carry Q != 0, so the network is asked for conditional structure at charges
# it never saw there. Coverage, not frequency, is what the training data has
# to supply -- the same principle the generalization argument rests on.
#
# `sector_augment` supplies it by applying random instanton shifts to already
# generated configurations, which costs nothing extra in HMC and works at
# couplings where the chain itself never tunnels. That is the point worth
# making in the paper: training data at beta far above the freezing threshold
# does not require a sampler that can tunnel there.
# Extends u1's random-beta coverage past wide250.yaml's random_rungs
# ceiling (beta_max=250) up to 2000, matching wide2000.yaml's new fixed-rung
# range. Originally queued for the Snapdragon X Elite machine
# (docs/SNAPDRAGON_TASKS.md); moved to run locally on Windows CPU 2026-09-04
# after that machine's run kept failing.
#
# REWRITTEN 2026-09-04 as explicit fixed rungs, not a random_rungs block.
# The first version used random_rungs with expand_rungs()'s auto-tapered
# burn_in (2000 sweeps flat for any cold-start rung beta >= 20), which
# 69_widening_test_data_check.py found insufficient at these couplings: a
# sign test on the 30 rungs found 23/30 positive z (p=0.005) -- a genuine
# systematic, not noise, and every cold-start rung's plaquette started at
# exactly 1.0 and relaxed toward the true value, so a coherent POSITIVE bias
# is exactly the signature of under-relaxation. Confirmed causally by
# regenerating the worst offender (L32, beta=381.875) at burn_in=8000:
# z went from +4.88 to -0.55. Worse for L32 (3/6 rungs flagged) than L16
# (4/24), consistent with a larger lattice needing more sweeps to mix.
# random_rungs' burn_in policy is NOT overridable per-spec (hardcoded inside
# utils.expand_rungs), so the same 30 (beta, lattice_size) draws are
# reproduced here as explicit rungs with burn_in: 8000 throughout -- the one
# verified-sufficient value, not a tapered guess. Cross-checked against the
# EXISTING wide250/wide2000 random_rungs data (beta capped at 250): those
# show no such systematic (7/12 L32 rungs positive, statistically
# unremarkable), so this issue is specific to this beta>250 extension and
# does NOT implicate the already-trained score_net_wide250.pt or the
# in-progress score_net_wide2000.pt.
seed: 1
device: cpu
action_type: wilson

data:
  out_dir: out/u1_2d/data_random_2000_sectorfix
  n_chains: 16
  thin: 5
  burn_in: 200
  n_configs: 128
  hmc_steps: 5
  hmc_step_size: 0.2
  hot_start: true
  topological_updates: true
  sector_augment: 0.5
  rungs:
    - {beta: 1227.28, lattice_size: 16, hot_start: false, burn_in: 8000, sector_augment: 0.5}
