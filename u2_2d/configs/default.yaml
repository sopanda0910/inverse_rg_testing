# Full three-rung ladder: L = 8 -> 16 -> 32 -> 64 with beta_f = 4 beta_c.
# The determinant sector's exact <Q^2> is nearly a fixed point of this ladder
# (lgt.blocking.ladder_charge_fixed_point), so climbing it is a continuum-limit
# trajectory at fixed physical volume, and the coarse P(Q) already IS the fine
# theory's P(Q).
seed: 0
device: auto

data:
  out_dir: out/u2_2d/data
  # n_chains matters more than n_configs above the freezing threshold: local
  # dynamics never moves a chain between sectors there, so the number of
  # INDEPENDENT topological charges in the ensemble is exactly n_chains, no
  # matter how many configurations are drawn from them.
  n_chains: 32
  thin: 5
  topological_updates: true
  winding_charge_step: 2
  # Above the freezing threshold the winding move only reaches even charge, so
  # frozen rungs are started from sectors drawn out of the exact P(Q). Ensembles
  # built this way have exact sector weights BY CONSTRUCTION and must not also be
  # cited as evidence that P(Q) is reproduced. See lgt/sector_seed.py.
  #
  # SEEDING IS OFF AT L = 8 (measured, scripts/07_pq_sampling.py). Two thresholds
  # govern this and they are not the same:
  #   * the central (even) instanton costs 2 pi^2 beta / V, and the ladder holds
  #     beta / V nearly constant (0.219 -> 0.202 -> 0.198 -> 0.197), so even-charge
  #     mobility is a LADDER INVARIANT and never degrades as L grows;
  #   * an odd charge change must drag SU(2) across the Z_2 monodromy at cost
  #     O(beta L), which along the ladder goes as L^3 (112 -> 828 -> 6500 -> 51766),
  #     so the odd/even BALANCE freezes quickly.
  # At L = 8, beta <= 14 both are healthy: unseeded HMC + winding reproduces the
  # closed form with <Q^2> z = +0.16, chi2/dof = 1.29, odd-sector ratio 0.978 and
  # no frozen chains. By L = 32, beta = 203 the chains still tunnel (796 changes)
  # but the odd sectors are 22% depleted at z = -2.22 -- PARITY-FROZEN, not frozen.
  # So the ladder's base is now sampled rather than installed, and its P(Q) IS
  # evidence. The colder rungs stay seeded: they are training data and validation
  # references, and topology is transported rather than learned, so their sector
  # weights never enter the ladder's topological claim.
  seed_exact_sectors: true
  # Heatbath + overrelaxation equilibrates the local modes far faster per unit
  # work than HMC trajectories do, so burn_in drops from thousands to hundreds.
  # The check is printed every run: measured plaquette against the closed form.
  thermalize_sweeps: 60
  rungs:
    - {beta: 3.5,   lattice_size: 8,  n_configs: 1024, burn_in: 300, hot_start: true, seed_exact_sectors: false, n_chains: 128}
    - {beta: 7.0,   lattice_size: 8,  n_configs: 1024, burn_in: 150, seed_exact_sectors: false, n_chains: 128}
    # The ladder BASE. hot_start is not the default here (beta > 4) but it is
    # required: from a cold start every chain begins at Q = 0 and topology has to
    # climb, which 200 trajectories does not finish -- measured <Q^2> = 0.484
    # against an exact 0.551, still visibly rising at the thermalization check
    # (0.227 after 60 sweeps). Starting hot and relaxing DOWN reaches 0.5547 +-
    # 0.0209 (scripts/07_pq_sampling.py). This rung carries the whole sampled-P(Q)
    # claim, so it gets the longer burn-in too.
    - {beta: 14.0,  lattice_size: 8,  n_configs: 1024, burn_in: 400, seed_exact_sectors: false, n_chains: 128, hot_start: true}
    - {beta: 14.0,  lattice_size: 16, n_configs: 1024, burn_in: 200}
    # The ladder BASE (see the `ladder:` block). Unseeded and hot-started for the
    # same reasons as the L = 8 rungs, and measured clean at this coupling:
    # <Q^2> = 1.0088 +- 0.0110 against an exact 1.0012 (z = +0.69), chi2/dof 0.27,
    # 22260 sector changes, no frozen chains (scripts/07_pq_sampling.py).
    # beta = 51.75 at this L is NOT usable -- it is PARITY-FROZEN (z_odd puts the
    # odd sectors outside tolerance at chi2/dof 2.89 despite 14455 sector changes),
    # because the odd-charge barrier goes as beta L and 828 is already past it
    # while 448 is not. Do not raise this coupling without re-running that scan.
    - {beta: 28.0,  lattice_size: 16, n_configs: 1024, burn_in: 400,
       seed_exact_sectors: false, n_chains: 256, hot_start: true}
    - {beta: 56.0,  lattice_size: 16, n_configs: 1024, burn_in: 250}
    - {beta: 51.75, lattice_size: 16, n_configs: 1024, burn_in: 250}
    - {beta: 56.0,  lattice_size: 32, n_configs: 512,  burn_in: 250}
    - {beta: 203.15, lattice_size: 32, n_configs: 512, burn_in: 300}

train:
  checkpoint_path: out/u2_2d/checkpoints/det_score_net.pt
  epochs: 120
  batch_size: 32
  learning_rate: 2.0e-4
  hidden: 64
  depth: 4
  cond_channels: 5
  cond_film: true
  norm_type: channel
  sigma_min_beta_coef: 0.35
  high_beta_sigma_bias: 0.5
  sym_augment: 0.5
  early_stop_patience: 25
  val_fraction: 0.1

ladder:
  out_dir: out/u2_2d/ladder
  # RG-MATCHED, not tree level: the base ensemble has to be distributed as the
  # blocked fine ensemble, so beta_base = approx_matched_coarse_beta(beta_fine).
  # At beta_fine = 56 that is 15.05, not 14.00; the two agree only as beta -> inf.
  # TOPOLOGY-MATCHED, not plaquette-matched. An inverse-RG step transports Q as an
  # IDENTITY, so the base's P(Q) is what every rung above it gets -- and under the
  # plaquette-matched schedule the exact <Q^2> still drifts -6.9% from L = 8 to
  # L = 64, a systematic the ladder cannot correct. `blocking.topology_matched_
  # schedule` picks beta_f so the exact <Q^2> is preserved instead (1.00119 at
  # every rung here), leaving only the base's statistical error. The price is a
  # coupling 2-3% below the plaquette-matched one; the two agree to 0.3% by the
  # top rung and diverge only where the small-lattice P(Q) is pre-asymptotic.
  base: {beta: 28.0, lattice_size: 16}
  beta_schedule: [105.651, 416.524]
  n_configs: 512
  n_sampler_steps: 200
  n_corrector_steps: 1
  n_su2_sweeps: 30
  n_retherm_sweeps: 10
  batch_size: 64
  consistency_weight: 1.0
  enforce_coarse_charge: true
  physics_blend_coef: 0.0

validate:
  out_dir: out/u2_2d/validation
  n_reference_configs: 512
  n_chains: 32
  burn_in: 1500
  generate_reference: true
  # The L = 64 rung is the extrapolation the method exists for: no direct HMC
  # reference is generated there, it is compared against the closed form only.
  max_reference_lattice_size: 32
