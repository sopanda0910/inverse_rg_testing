train:
  checkpoint_path: out/u2_2d/checkpoints/det_score_net_cov15.pt
  history: out/u2_2d/checkpoints/det_score_net_cov15.history.json
  resume: true
  epochs: 120
  batch_size: 32
  learning_rate: 2.0e-4
  sigma_min: 0.02
  sigma_max: 6.0
  hidden: 64
  depth: 4
  kernel_size: 3
  cond_channels: 5
  val_fraction: 0.1
  topo_weight: 0.0
  ema_decay: 0.999
  early_stop_patience: 0
  snapshot_every: 10

ladder:
  out_dir: out/u2_2d/ladder_cov15
  base: {beta: 28.0, lattice_size: 16}
  beta_schedule: [105.651, 416.524]
  n_configs: 1024
  n_sampler_steps: 200
  n_corrector_steps: 1
  n_su2_sweeps: 30
  n_retherm_sweeps: 10
  batch_size: 64
  consistency_weight: 1.0
  enforce_coarse_charge: true
  physics_blend_coef: 0.0

validate:
  out_dir: out/u2_2d/validation_cov15
  n_reference_configs: 512
  n_chains: 32
  burn_in: 1500
  generate_reference: true
  max_reference_lattice_size: 32
