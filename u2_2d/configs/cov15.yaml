# Coverage-ablation challenger, lighter than cov60: SAME capacity/training
# recipe as default.yaml (hidden 64, depth 4, batch 32, 120 epochs) but
# training coverage capped at model beta ~15.0, built from ensembles ALREADY
# GENERATED under data_v2 (no new HMC). One point in the coverage sweep
# {15, 30, 60, ~104 (default), ~107.5 (v2/cap)} -- see 57/58/59 and
# CLAUDE.md's u2 coverage discussion. Deliberately run on CPU: at this
# coverage the training set (71 rungs, lighter than cov60's 100) is
# small enough that CPU is a reasonable place to put it while the GPU is
# already carrying v2/cap/cov60/wide250.

seed: 0
device: cuda

data:
  out_dir: out/u2_2d/data_v2
  n_chains: 32
  thin: 5
  topological_updates: true
  winding_charge_step: 1
  winding_interval: 5
  seed_exact_sectors: true
  thermalize_sweeps: 60
