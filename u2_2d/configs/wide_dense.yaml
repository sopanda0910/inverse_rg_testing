  heldout:
    - {beta: 80.0, lattice_size: 16, n_configs: 128, burn_in: 300,
       thermalize_sweeps: 60}

train:
  checkpoint_path: out/u2_2d/checkpoints/det_score_net_wide_dense.pt
  epochs: 120
  batch_size: 32
  learning_rate: 2.0e-4
  hidden: 64
  depth: 4
  cond_channels: 5
  cond_film: true
  norm_type: channel
  sigma_min_beta_coef: 0.35
  high_beta_sigma_bias: 0.5
  sym_augment: 0.5
  early_stop_patience: 25
  val_fraction: 0.1
  resume: true
  snapshot_every: 5

ladder:
  out_dir: out/u2_2d/ladder_wide_dense
  base: {beta: 28.0, lattice_size: 16}
  beta_schedule: [105.651, 416.524]
  n_configs: 1024
  n_sampler_steps: 200
  n_corrector_steps: 1
  n_su2_sweeps: 30
  n_retherm_sweeps: 10
  batch_size: 64
  consistency_weight: 1.0
  enforce_coarse_charge: true
  physics_blend_coef: 0.0

validate:
  out_dir: out/u2_2d/validation_wide_dense
  n_reference_configs: 512
  n_chains: 32
  burn_in: 1500
  generate_reference: true
  max_reference_lattice_size: 32
