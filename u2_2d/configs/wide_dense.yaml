# Density-matched twin of wide.yaml, built 2026-09-05 for the same reason as
# u1_2d/configs/wide2000_dense.yaml: wide.yaml's 12 new fixed rungs
# (raw beta 600-2000, L=8) are bare anchor points with NO random_rungs
# density, unlike u2's deployed recipe (12 fixed + dense random_rungs up to
# beta~430). This isolates whether wide's measured degradation is a range
# effect or a density-confound artifact. Identical to wide.yaml in every
# respect -- same capacity (hidden=64, depth=4), same fixed rungs, same
# absence of low-range random_rungs (matching wide.yaml's own deliberate
# choice to mirror the deployed checkpoint's recipe there) -- except the 31
# additional rungs below, generated 2026-09-04 by
# u2_2d/configs/random_rungs_2000_gen.yaml (raw beta 430-2000 at L=8/16/32,
# counts scaled proportionally to log-range density against the deployed
# checkpoint's beta 4-430 random_rungs block) and copied from
# out/u2_2d/data_random_2000/ into this config's out_dir (out/u2_2d/data,
# already containing wide.yaml's own rungs -- filenames do not collide).
#
# If this checkpoint's cost-efficiency at coverage_scan's matched couplings
# (sec:coverage-u2) recovers relative to wide, density was the driver. If it
# does not, wide's own past-ceiling win (sec:coverage-u2, wins 6/7,
# p=0.031) and in-coverage null (wins 12/22, p=0.50) stand as genuine range
# effects, not a density confound.
seed: 0
device: auto

data:
  out_dir: out/u2_2d/data
  n_chains: 32
  thin: 5
  topological_updates: true
  winding_charge_step: 1
  winding_interval: 5
  seed_exact_sectors: true
  thermalize_sweeps: 60
  rungs:
    - {beta: 3.5,   lattice_size: 8,  n_configs: 1024, burn_in: 300, hot_start: true, seed_exact_sectors: false, n_chains: 128}
    - {beta: 7.0,   lattice_size: 8,  n_configs: 1024, burn_in: 150, seed_exact_sectors: false, n_chains: 128}
    - {beta: 14.0,  lattice_size: 8,  n_configs: 1024, burn_in: 400, seed_exact_sectors: false, n_chains: 128, hot_start: true}
    - {beta: 14.0,  lattice_size: 16, n_configs: 4096, burn_in: 400,
       seed_exact_sectors: false, n_chains: 1024, hot_start: true}
    - {beta: 28.0,  lattice_size: 16, n_configs: 4096, burn_in: 400,
       seed_exact_sectors: false, n_chains: 1024, hot_start: true}
    - {beta: 56.0,  lattice_size: 16, n_configs: 1024, burn_in: 250, sector_augment: 0.5}
    - {beta: 51.75, lattice_size: 16, n_configs: 1024, burn_in: 250, sector_augment: 0.5}
    - {beta: 56.0,  lattice_size: 32, n_configs: 512,  burn_in: 250, sector_augment: 0.5}
    - {beta: 203.15, lattice_size: 32, n_configs: 512, burn_in: 300, sector_augment: 0.5}
    - {beta: 105.651, lattice_size: 32, n_configs: 512, burn_in: 300, sector_augment: 0.5}
    - {beta: 416.524, lattice_size: 32, n_configs: 512, burn_in: 300, sector_augment: 0.5}
    - {beta: 416.524, lattice_size: 64, n_configs: 512, burn_in: 300, n_chains: 64,
       train: false}
    - {beta: 600.0,  lattice_size: 8, n_configs: 384, burn_in: 300, n_chains: 64}
    - {beta: 700.0,  lattice_size: 8, n_configs: 384, burn_in: 300, n_chains: 64}
