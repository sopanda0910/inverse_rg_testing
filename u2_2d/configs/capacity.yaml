# Capacity experiment (2026-08-21). IDENTICAL to v2.yaml except the four
# train knobs below and the four output paths, so any difference is
# attributable to capacity rather than to data.
#   hidden 64 -> 96, depth 4 -> 5, batch_size 32 -> 64, epochs 120 -> 260
# Data stays out/u2_2d/data_v2 -- already generated, 113 rungs.
seed: 0
device: auto
data:
  out_dir: out/u2_2d/data_v2
  n_chains: 32
  thin: 5
  topological_updates: true
  winding_charge_step: 1
  winding_interval: 5
  seed_exact_sectors: true
  thermalize_sweeps: 60
  rungs:
  - beta: 3.5
    lattice_size: 8
    n_configs: 1024
    burn_in: 300
    hot_start: true
    seed_exact_sectors: false
    n_chains: 128
  - beta: 7.0
    lattice_size: 8
    n_configs: 1024
    burn_in: 150
    seed_exact_sectors: false
    n_chains: 128
  - beta: 14.0
    lattice_size: 8
    n_configs: 1024
    burn_in: 400
    seed_exact_sectors: false
    n_chains: 128
    hot_start: true
  - beta: 14.0
    lattice_size: 16
    n_configs: 4096
    burn_in: 400
    seed_exact_sectors: false
    n_chains: 1024
    hot_start: true
  - beta: 28.0
    lattice_size: 16
    n_configs: 4096
    burn_in: 400
    seed_exact_sectors: false
    n_chains: 1024
    hot_start: true
  - beta: 56.0
    lattice_size: 16
    n_configs: 1024
    burn_in: 250
    sector_augment: 0.5
  - beta: 51.75
    lattice_size: 16
    n_configs: 1024
    burn_in: 250
    sector_augment: 0.5
  - beta: 56.0
    lattice_size: 32
    n_configs: 512
    burn_in: 250
    sector_augment: 0.5
  - beta: 203.15
    lattice_size: 32
    n_configs: 512
    burn_in: 300
    sector_augment: 0.5
  - beta: 105.651
    lattice_size: 32
    n_configs: 512
    burn_in: 300
    sector_augment: 0.5
  - beta: 416.524
    lattice_size: 32
    n_configs: 512
    burn_in: 300
    sector_augment: 0.5
  - beta: 416.524
    lattice_size: 64
    n_configs: 512
    burn_in: 300
    n_chains: 64
    train: false
  random_rungs:
  - n: 60
    beta_min: 4.0
    beta_max: 430.0
    lattice_size: 16
    n_configs: 128
  - n: 12
    beta_min: 8.0
    beta_max: 430.0
    lattice_size: 32
    n_configs: 128
  - n: 6
    beta_min: 4.0
    beta_max: 60.0
    lattice_size: 8
    n_configs: 128
  - n: 24
    beta_min: 8.0
    beta_max: 430.0
    lattice_size: 32
    n_configs: 128
  heldout:
  - beta: 80.0
    lattice_size: 16
    n_configs: 128
    burn_in: 300
    thermalize_sweeps: 60
train:
  checkpoint_path: out/u2_2d/checkpoints/det_score_net_cap.pt
  epochs: 260
  batch_size: 64
  learning_rate: 0.0002
  hidden: 96
  depth: 5
  cond_channels: 5
  cond_film: true
  norm_type: channel
  sigma_min_beta_coef: 0.35
  high_beta_sigma_bias: 0.5
  sym_augment: 0.5
  early_stop_patience: 40
  val_fraction: 0.1
ladder:
  out_dir: out/u2_2d/ladder_cap
  base:
    beta: 28.0
    lattice_size: 16
  beta_schedule:
  - 105.651
  - 416.524
  n_configs: 1024
  n_sampler_steps: 200
  n_corrector_steps: 1
  n_su2_sweeps: 30
  n_retherm_sweeps: 10
  batch_size: 64
  consistency_weight: 1.0
  enforce_coarse_charge: true
  physics_blend_coef: 0.0
validate:
  out_dir: out/u2_2d/validation_cap
  n_reference_configs: 512
  n_chains: 32
  burn_in: 1500
  generate_reference: true
  max_reference_lattice_size: 32
