# 2D SU(2) pipeline config.
# Coupling matching across one 2x2 blocking step is EXACT in 2D:
# p(beta_c) = p(beta_f)^4  (lgt.blocking.matched_coarse_beta). The L=8 rungs
# below are the matched partners of the L=16 rungs -- 8:2.109 <-> 16:8 and
# 8:4.305 <-> 16:16 -- not the tree-level beta_f/4 (4.000), which is a
# different distribution and produced a train/test mismatch in run 2.

action: wilson
seed: 20260802

data:
  out_dir: out/su2_2d/data
  rungs:                 # anchor rungs: the two matched ladder pairs
    - [8, 2.109]
    - [8, 4.305]
    - [16, 8.0]
    - [16, 16.0]
  # Continuous-beta coverage (the U(1) v6 lesson): the score net is
  # FiLM-conditioned on log beta, so it can only interpolate/extrapolate in
  # beta if training spans beta densely. Four discrete couplings would teach
  # it four points; the ladder needs a function.
  random_rungs:
    - {n: 24, beta_min: 0.5, beta_max: 32.0, lattice_size: 8, n_configs: 128}
    - {n: 12, beta_min: 2.0, beta_max: 32.0, lattice_size: 16, n_configs: 128}
  # never trained on -- honest generalization signal during training, and the
  # save guard (ported from the U(1) guarded-checkpoint protocol)
  heldout:
    - {lattice_size: 16, beta: 12.0, n_configs: 128}
  n_configs: 256
  n_chains: 8
  burn_in: 400
  thin: 5

train:
  checkpoint: out/su2_2d/checkpoints/score_net.pt
  hidden: 48
  depth: 4
  conditional: true
  sigma_min: 0.05
  sigma_max: 2.5
  # beta-aware floor: physical link fluctuations are ~1/sqrt(beta), so a fixed
  # floor never trains the endgame where it matters (U(1) raw-seed-wall fix)
  sigma_min_beta_coef: 0.3
  high_beta_sigma_bias: 0.5   # oversample small sigma at large beta
  sym_augment: true           # D4 lattice symmetries (action-invariance tested)
  lr: 3.0e-4
  ema_decay: 0.999
  train_steps: 60000
  batch_size: 16

sample:
  out_dir: out/su2_2d/generated
  n_configs: 128
  n_ode_steps: 60
  # first lift: coarse (8, matched) -> fine (16, 16.0); coarse_beta is derived
  # from fine_beta by exact matching unless overridden here
  coarse_L: 8
  fine_beta: 16.0
