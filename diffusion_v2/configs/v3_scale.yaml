# ESS-gap capacity/data scale-up (2026-08-01), based on v2.yaml. Targets the
# beta*V-scaling density gap measured in the ESS chain (paper appendix Figs.
# 23-25, Table S5): the log-weight spread grows with volume, implicating L=32
# coverage (12 of 82 rungs in v2) and model capacity (hidden 56, depth 4).
# Changes vs v2.yaml -- everything else identical, so comparisons isolate them:
#   1. +24 L=32 random rungs (APPENDED as a new random_rungs spec: expand_rungs
#      seeds each spec independently, so all existing v2 ensembles are reused
#      verbatim and only the new rungs are generated). Beta range unchanged
#      ([2, 60]) -- the extrapolation-beyond-training narrative must survive.
#   2. Capacity hidden 56 -> 80, depth 4 -> 5 (~2.5x compute), epochs 100 -> 80
#      with early stopping; fresh training (architecture change, no warm start).
#   3. Separate checkpoint path (score_net_big.pt) -- the v2 campaign
#      checkpoint is never touched.

seed: 0
device: auto
action_type: wilson

data:
  out_dir: out/diffusion_v2/data
  rungs:
    - {beta: 14.1464, lattice_size: 16, hot_start: false, burn_in: 600, sector_augment: 0.5}
    - {beta: 25.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 40.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 55.0237, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
  random_rungs:
    - {n: 60, beta_min: 1.0, beta_max: 60.0, lattice_size: 16, n_configs: 128}
    - {n: 12, beta_min: 2.0, beta_max: 60.0, lattice_size: 32, n_configs: 128}
    - {n: 6, beta_min: 1.0, beta_max: 8.0, lattice_size: 8, n_configs: 128}
    - {n: 24, beta_min: 2.0, beta_max: 60.0, lattice_size: 32, n_configs: 128}
  heldout:
    - {beta: 20.0, lattice_size: 16, hot_start: false, burn_in: 2000, n_configs: 128}
  n_configs: 448
  n_chains: 16
  burn_in: 200
  thin: 5
  hmc_steps: 5
  hmc_step_size: 0.2
  topological_updates: true
  hot_start: true

train:
  epochs: 80
  batch_size: 16
  learning_rate: 3.0e-4
  sigma_min: 0.03
  sigma_max: 6.0
  sigma_min_beta_coef: 0.3
  high_beta_sigma_bias: 0.3
  sym_augment: 0.5
  norm_type: channel
  cond_film: true
  hidden: 80
  depth: 5
  kernel_size: 3
  cond_channels: 5
  val_fraction: 0.1
  topo_weight: 0.1
  early_stop_patience: 12
  ema_decay: 0.999
  grad_clip_norm: 1.0
  snapshot_every: 5
  checkpoint: out/diffusion_v2/checkpoints/score_net_big.pt
  history: out/diffusion_v2/checkpoints/history_big.json

ladder:
  base: {beta: 1.3472, lattice_size: 8}
  n_base_configs: 192
  beta_schedule: [4.0, 14.1464, 55.0237]
  n_retherm_sweeps: 16
  n_sampler_steps: 200
  n_corrector_steps: 1
  corrector_snr: 0.16
  consistency_weight: 1.0
  enforce_coarse_charge: true
  charge_projection_sigma: 0.5
  charge_projection_interval: 10
  retherm_topological_updates: false
  sample_batch_size: 32
  out_dir: out/diffusion_v2/generated
  physics_blend_coef: 1.0
  physics_blend_beta_min: 5.0
  sigma_min_beta_coef: 0.1

validate:
  out_dir: out/diffusion_v2/validation
  n_reference_configs: 384
  freezing_rung: {beta: 55.0237, lattice_size: 64}
  freezing_hmc_length: 300
