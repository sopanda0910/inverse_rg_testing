# diffusion_v2 campaign config. Data coverage matches demo_v6 (same seed, same
# rung specs) so v2-vs-v6 checkpoint comparisons isolate the model/training
# changes:
#   1. Validation-loss noise now uses the beta-aware floor (bug fix -- best
#      checkpoint selection previously ran on a different sigma distribution).
#   2. Small-sigma oversampling at high beta (train.high_beta_sigma_bias) -- the
#      training-side fix for the raw-seed wall the exact-score blend papered over.
#   3. Symmetry augmentation (train.sym_augment): D4 rotations/reflections +
#      charge conjugation, exact action symmetries a plain CNN does not have.
#   4. Per-site channel norm (train.norm_type: channel) removes GroupNorm's
#      lattice-wide statistics -- a hidden volume dependence for L >> training.
#   5. Global coarse FiLM (train.cond_film) gives every block the coarse winding
#      sum 2 pi Q / V, unreachable through a local receptive field.
#   6. Beta-gated exact-score blend (ladder.physics_blend_beta_min) -- blend off
#      below beta ~ 5 where the harmonic limit is poor and HMC already wins.
#   7. Honest topology default: ladder.retherm_topological_updates: false --
#      rethermalization cannot manufacture topology; the model + structural
#      transport must carry it (README's recommended test setting).

seed: 0
device: auto
action_type: wilson

data:
  out_dir: out/diffusion_v2/data
  rungs:
    - {beta: 14.1464, lattice_size: 16, hot_start: false, burn_in: 600, sector_augment: 0.5}
    - {beta: 25.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 40.0, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
    - {beta: 55.0237, lattice_size: 16, hot_start: false, burn_in: 2000, sector_augment: 0.5}
  random_rungs:
    - {n: 60, beta_min: 1.0, beta_max: 60.0, lattice_size: 16, n_configs: 128}
    - {n: 12, beta_min: 2.0, beta_max: 60.0, lattice_size: 32, n_configs: 128}
    - {n: 6, beta_min: 1.0, beta_max: 8.0, lattice_size: 8, n_configs: 128}
  heldout:
    - {beta: 20.0, lattice_size: 16, hot_start: false, burn_in: 2000, n_configs: 128}
  n_configs: 448
  n_chains: 16
  burn_in: 200
  thin: 5
  hmc_steps: 5
  hmc_step_size: 0.2
  topological_updates: true
  hot_start: true

train:
  epochs: 100
  batch_size: 16
  learning_rate: 3.0e-4
  sigma_min: 0.03
  sigma_max: 6.0
  sigma_min_beta_coef: 0.3
  high_beta_sigma_bias: 0.3
  sym_augment: 0.5
  norm_type: channel
  cond_film: true
  hidden: 56
  depth: 4
  kernel_size: 3
  cond_channels: 5
  val_fraction: 0.1
  topo_weight: 0.1
  early_stop_patience: 0
  ema_decay: 0.999
  grad_clip_norm: 1.0
  snapshot_every: 5
  checkpoint: out/diffusion_v2/checkpoints/score_net.pt
  history: out/diffusion_v2/checkpoints/history.json

ladder:
  base: {beta: 1.3472, lattice_size: 8}
  n_base_configs: 192
  beta_schedule: [4.0, 14.1464, 55.0237]
  n_retherm_sweeps: 16
  n_sampler_steps: 200
  n_corrector_steps: 1
  corrector_snr: 0.16
  consistency_weight: 1.0
  enforce_coarse_charge: true
  charge_projection_sigma: 0.5
  charge_projection_interval: 10
  retherm_topological_updates: false
  sample_batch_size: 32
  out_dir: out/diffusion_v2/generated
  physics_blend_coef: 1.0
  physics_blend_beta_min: 5.0
  sigma_min_beta_coef: 0.1

validate:
  out_dir: out/diffusion_v2/validation
  n_reference_configs: 384
  freezing_rung: {beta: 55.0237, lattice_size: 64}
  freezing_hmc_length: 300
